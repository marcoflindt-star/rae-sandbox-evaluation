name: Synthetic RAE guard evaluation

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RAE_ARTIFACT_DIR: artifacts
      RAE_ISOLATION_ATTESTED: ""
      RAE_SNAPSHOT_ID: ""
      RAE_EGRESS_LOG: ""
      RAE_ARTIFACT_SHA256: ""
      SSH_AUTH_SOCK: ""
      DOCKER_HOST: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af6831 # v4.2.2
      - name: Verify runner is clean and unprivileged for this test
        run: |
          test -z "$SSH_AUTH_SOCK"
          test -z "$DOCKER_HOST"
          test "$(id -u)" != "0"
      - name: Run synthetic fail-closed tests
        run: python3 tests/test_guard.py
      - name: Validate container policy
        run: |
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("policy", "tests/test_container_policy.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.test_container_policy_is_fail_closed()
          module.test_container_policy_has_no_host_mounts_or_privileged_mode()
          print("container policy: PASS")
          PY
      - name: Install pinned browser test dependency
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'playwright==1.58.0'
          python3 -m playwright install --with-deps chromium
      - name: Capture and redact synthetic HAR
        run: python3 tests/test_browser_har.py
      - name: Run direct Playwright isolated browser test
        run: python3 tests/test_playwright_direct.py
      - name: Run negative egress blocking test
        run: python3 tests/test_negative_egress.py
      - name: Run ephemeral interruption cleanup test
        run: python3 tests/test_ephemeral_state.py
      - name: Run snapshot manifest restore test
        run: python3 tests/test_restore_manifest.py
      - name: Run policy contract test
        run: python3 tests/test_policy_contract.py
      - name: Run resource boundary tests
        run: python3 tests/test_resource_limits.py
      - name: Run log integrity tests
        run: python3 tests/test_log_integrity.py
      - name: Run log access permission test
        run: python3 tests/test_log_permissions.py
      - name: Run artifact export manifest test
        run: python3 tests/test_export_manifest.py
      - name: Run reproducibility test
        run: python3 tests/test_reproducibility.py
      - name: Run preproduction release gate
        run: python3 tests/test_release_gate.py
      - name: Generate final evaluation report
        run: python3 tests/generate_final_report.py
      - name: Upload synthetic evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-evaluation-evidence
          path: artifacts/
          if-no-files-found: error
